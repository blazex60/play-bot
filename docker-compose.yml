# Docker's own log driver can only rotate by size; the 7-day retention of the
# structured application logs is handled by src/logging into ./logs.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  music-bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_DIR: /app/logs
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    logging: *default-logging
    network_mode: "host"
    # GTX 970 passed through to the host VM, used by Demucs for stem
    # separation (src/audio/demucsDevice.js). Requires nvidia-container-
    # toolkit; without a GPU the container will not start, so remove this
    # block (Demucs then runs on CPU) if the GPU is taken out.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  music-web:
    build: .
    restart: unless-stopped
    command: ["node", "src/web/server/index.js"]
    env_file:
      - .env
    environment:
      LOG_DIR: /app/logs
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    logging: *default-logging
    network_mode: "host"
    depends_on:
      - music-bot

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    env_file:
      - .env
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    logging: *default-logging
    network_mode: "host"
    depends_on:
      - music-web
